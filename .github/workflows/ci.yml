name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24
          install: false

      - name: Record toolchain
        shell: bash
        run: |
          node --version
          pnpm --version
          git --version

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify zero production dependencies
        run: pnpm check:runtime-deps

  codex-noauth-real:
    name: codex no-auth real / ${{ matrix.os }}
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[codex-noauth]') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24
          install: false

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned native Codex CLI (POSIX)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          node <<'NODE'
          const { appendFileSync, chmodSync, copyFileSync, existsSync, mkdirSync } = require('node:fs');
          const { EOL } = require('node:os');
          const { join } = require('node:path');
          const { spawnSync } = require('node:child_process');

          const installRoot = join(process.env.RUNNER_TEMP, 'delethos-codex-install');
          mkdirSync(installRoot, { recursive: true });
          const install = spawnSync(
            'npm',
            [
              'install',
              '--prefix', installRoot,
              '--ignore-scripts',
              '--include=optional',
              '--no-audit',
              '--no-fund',
              '--package-lock=false',
              '@openai/codex@0.152.0',
            ],
            { stdio: 'inherit', shell: false },
          );
          if (install.status !== 0) {
            throw new Error(`pinned Codex install failed with status ${install.status ?? 'null'}`);
          }

          const targets = {
            'linux:x64': ['codex-linux-x64', 'x86_64-unknown-linux-musl'],
            'linux:arm64': ['codex-linux-arm64', 'aarch64-unknown-linux-musl'],
            'darwin:x64': ['codex-darwin-x64', 'x86_64-apple-darwin'],
            'darwin:arm64': ['codex-darwin-arm64', 'aarch64-apple-darwin'],
          };
          const selected = targets[`${process.platform}:${process.arch}`];
          if (!selected) {
            throw new Error(`unsupported hosted qualification platform ${process.platform}/${process.arch}`);
          }

          const [platformPackage, targetTriple] = selected;
          const source = join(
            installRoot,
            'node_modules',
            '@openai',
            platformPackage,
            'vendor',
            targetTriple,
            'bin',
            'codex',
          );
          if (!existsSync(source)) {
            throw new Error(`pinned Codex native executable was not found at ${source}`);
          }

          const binDir = join(process.env.RUNNER_TEMP, 'delethos-codex-bin');
          mkdirSync(binDir, { recursive: true });
          const destination = join(binDir, 'codex');
          copyFileSync(source, destination);
          chmodSync(destination, 0o755);

          const version = spawnSync(destination, ['--version'], { encoding: 'utf8', shell: false });
          const observed = `${version.stdout ?? ''}${version.stderr ?? ''}`.trim();
          if (version.status !== 0 || !observed.includes('0.152.0')) {
            throw new Error(`unexpected Codex version: status=${version.status ?? 'null'} output=${observed}`);
          }
          console.log(`Pinned Codex CLI: ${observed}`);
          appendFileSync(process.env.GITHUB_PATH, `${binDir}${EOL}`);
          NODE

      - name: Install pinned native Codex CLI (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'delethos-codex-install'
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          Set-Content -Path (Join-Path $installRoot 'package.json') -Value '{"private":true}' -NoNewline

          pnpm --dir $installRoot add --ignore-scripts --save-exact '@openai/codex@0.152.0'
          if ($LASTEXITCODE -ne 0) {
            throw "pinned Codex install failed with exit code $LASTEXITCODE"
          }

          $arch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          if ($arch -eq 'x64') {
            $targetTriple = 'x86_64-pc-windows-msvc'
          } elseif ($arch -eq 'arm64') {
            $targetTriple = 'aarch64-pc-windows-msvc'
          } else {
            throw "unsupported hosted qualification Windows architecture $arch"
          }

          $nodeModules = Join-Path $installRoot 'node_modules'
          $suffix = "\vendor\$targetTriple\bin\codex.exe"
          $matches = @(
            Get-ChildItem -LiteralPath $nodeModules -Recurse -File -Filter 'codex.exe' |
              Where-Object { $_.FullName.EndsWith($suffix, [System.StringComparison]::OrdinalIgnoreCase) }
          )
          if ($matches.Count -ne 1) {
            $observedPaths = ($matches | ForEach-Object { $_.FullName }) -join '; '
            throw "expected exactly one pinned Codex native executable for $targetTriple; found $($matches.Count): $observedPaths"
          }
          $source = $matches[0].FullName

          $binDir = Join-Path $env:RUNNER_TEMP 'delethos-codex-bin'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $destination = Join-Path $binDir 'codex.exe'
          Copy-Item -LiteralPath $source -Destination $destination -Force

          $observed = (& $destination --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $observed.Contains('0.152.0')) {
            throw "unexpected Codex version: exit=$LASTEXITCODE output=$observed"
          }
          Write-Host "Pinned Codex CLI: $observed"
          Add-Content -Path $env:GITHUB_PATH -Value $binDir

      - name: Qualify missing binary
        run: node scripts/adapter-conformance.mjs --adapter codex --case missing-binary --output stdout

      - name: Qualify discovery and version
        run: node scripts/adapter-conformance.mjs --adapter codex --case discovery-version --output stdout

      - name: Qualify platform launch
        run: node scripts/adapter-conformance.mjs --adapter codex --case platform-launch --output stdout

      - name: Qualify authentication failure
        run: node scripts/adapter-conformance.mjs --adapter codex --case auth-failure --output stdout

  claude-missing-real:
    name: claude sentinel missing-binary real / ${{ matrix.os }}
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[claude-missing]') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24
          install: false

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard sentinel-only missing-binary semantics
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const source = readFileSync('scripts/adapter-conformance.mjs', 'utf8');
          const start = source.indexOf("if (selected.case === 'missing-binary')");
          const end = source.indexOf('\n    discovery = await discoverAdapter', start);
          if (start < 0 || end < 0 || end <= start) {
            throw new Error('missing-binary conformance block could not be bounded');
          }
          const block = source.slice(start, end);
          if (!block.includes('delethos-definitely-missing-${process.pid}')) {
            throw new Error('missing-binary sentinel semantics changed');
          }
          for (const forbidden of ['discoverAdapter(', 'startAgent(', 'runClaude(', 'authState(']) {
            if (block.includes(forbidden)) {
              throw new Error(`missing-binary block unexpectedly contains ${forbidden}`);
            }
          }
          console.log('Sentinel-only missing-binary semantics verified; no vendor executable discovery or invocation is in this case block.');
          NODE

      - name: Observe Claude candidate missing-executable path
        run: node scripts/adapter-conformance.mjs --adapter claude --case missing-binary --output stdout
