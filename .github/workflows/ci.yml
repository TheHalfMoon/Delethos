name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24
          install: false

      - name: Record toolchain
        shell: bash
        run: |
          node --version
          pnpm --version
          git --version

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify zero production dependencies
        run: pnpm check:runtime-deps

  codex-noauth-real:
    name: codex no-auth real / ${{ matrix.os }}
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[codex-noauth]') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24
          install: false

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned native Codex CLI (POSIX)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          node <<'NODE'
          const { appendFileSync, chmodSync, copyFileSync, existsSync, mkdirSync } = require('node:fs');
          const { EOL } = require('node:os');
          const { join } = require('node:path');
          const { spawnSync } = require('node:child_process');

          const installRoot = join(process.env.RUNNER_TEMP, 'delethos-codex-install');
          mkdirSync(installRoot, { recursive: true });
          const install = spawnSync(
            'npm',
            [
              'install',
              '--prefix', installRoot,
              '--ignore-scripts',
              '--include=optional',
              '--no-audit',
              '--no-fund',
              '--package-lock=false',
              '@openai/codex@0.152.0',
            ],
            { stdio: 'inherit', shell: false },
          );
          if (install.status !== 0) {
            throw new Error(`pinned Codex install failed with status ${install.status ?? 'null'}`);
          }

          const targets = {
            'linux:x64': ['codex-linux-x64', 'x86_64-unknown-linux-musl'],
            'linux:arm64': ['codex-linux-arm64', 'aarch64-unknown-linux-musl'],
            'darwin:x64': ['codex-darwin-x64', 'x86_64-apple-darwin'],
            'darwin:arm64': ['codex-darwin-arm64', 'aarch64-apple-darwin'],
          };
          const selected = targets[`${process.platform}:${process.arch}`];
          if (!selected) {
            throw new Error(`unsupported hosted qualification platform ${process.platform}/${process.arch}`);
          }

          const [platformPackage, targetTriple] = selected;
          const source = join(
            installRoot,
            'node_modules',
            '@openai',
            platformPackage,
            'vendor',
            targetTriple,
            'bin',
            'codex',
          );
          if (!existsSync(source)) {
            throw new Error(`pinned Codex native executable was not found at ${source}`);
          }

          const binDir = join(process.env.RUNNER_TEMP, 'delethos-codex-bin');
          mkdirSync(binDir, { recursive: true });
          const destination = join(binDir, 'codex');
          copyFileSync(source, destination);
          chmodSync(destination, 0o755);

          const version = spawnSync(destination, ['--version'], { encoding: 'utf8', shell: false });
          const observed = `${version.stdout ?? ''}${version.stderr ?? ''}`.trim();
          if (version.status !== 0 || !observed.includes('0.152.0')) {
            throw new Error(`unexpected Codex version: status=${version.status ?? 'null'} output=${observed}`);
          }
          console.log(`Pinned Codex CLI: ${observed}`);
          appendFileSync(process.env.GITHUB_PATH, `${binDir}${EOL}`);
          NODE

      - name: Install pinned native Codex CLI (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'delethos-codex-install'
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          Set-Content -Path (Join-Path $installRoot 'package.json') -Value '{"private":true}' -NoNewline

          pnpm --dir $installRoot add --ignore-scripts --save-exact '@openai/codex@0.152.0'
          if ($LASTEXITCODE -ne 0) {
            throw "pinned Codex install failed with exit code $LASTEXITCODE"
          }

          $arch = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          if ($arch -eq 'x64') {
            $targetTriple = 'x86_64-pc-windows-msvc'
          } elseif ($arch -eq 'arm64') {
            $targetTriple = 'aarch64-pc-windows-msvc'
          } else {
            throw "unsupported hosted qualification Windows architecture $arch"
          }

          $nodeModules = Join-Path $installRoot 'node_modules'
          $suffix = "\vendor\$targetTriple\bin\codex.exe"
          $matches = @(
            Get-ChildItem -LiteralPath $nodeModules -Recurse -File -Filter 'codex.exe' |
              Where-Object { $_.FullName.EndsWith($suffix, [System.StringComparison]::OrdinalIgnoreCase) }
          )
          if ($matches.Count -ne 1) {
            $observedPaths = ($matches | ForEach-Object { $_.FullName }) -join '; '
            throw "expected exactly one pinned Codex native executable for $targetTriple; found $($matches.Count): $observedPaths"
          }
          $source = $matches[0].FullName

          $binDir = Join-Path $env:RUNNER_TEMP 'delethos-codex-bin'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $destination = Join-Path $binDir 'codex.exe'
          Copy-Item -LiteralPath $source -Destination $destination -Force

          $observed = (& $destination --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $observed.Contains('0.152.0')) {
            throw "unexpected Codex version: exit=$LASTEXITCODE output=$observed"
          }
          Write-Host "Pinned Codex CLI: $observed"
          Add-Content -Path $env:GITHUB_PATH -Value $binDir

      - name: Qualify missing binary
        run: node scripts/adapter-conformance.mjs --adapter codex --case missing-binary --output stdout

      - name: Qualify discovery and version
        run: node scripts/adapter-conformance.mjs --adapter codex --case discovery-version --output stdout

      - name: Qualify platform launch
        run: node scripts/adapter-conformance.mjs --adapter codex --case platform-launch --output stdout

      - name: Qualify authentication failure
        run: node scripts/adapter-conformance.mjs --adapter codex --case auth-failure --output stdout

  claude-missing-real:
    name: claude sentinel missing-binary real / ${{ matrix.os }}
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[claude-missing]') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24
          install: false

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard sentinel-only missing-binary semantics
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const source = readFileSync('scripts/adapter-conformance.mjs', 'utf8');
          const start = source.indexOf("if (selected.case === 'missing-binary')");
          const end = source.indexOf('\n    discovery = await discoverAdapter', start);
          if (start < 0 || end < 0 || end <= start) {
            throw new Error('missing-binary conformance block could not be bounded');
          }
          const block = source.slice(start, end);
          if (!block.includes('delethos-definitely-missing-${process.pid}')) {
            throw new Error('missing-binary sentinel semantics changed');
          }
          for (const forbidden of ['discoverAdapter(', 'startAgent(', 'runClaude(', 'authState(']) {
            if (block.includes(forbidden)) {
              throw new Error(`missing-binary block unexpectedly contains ${forbidden}`);
            }
          }
          console.log('Sentinel-only missing-binary semantics verified; no vendor executable discovery or invocation is in this case block.');
          NODE

      - name: Observe Claude candidate missing-executable path
        run: node scripts/adapter-conformance.mjs --adapter claude --case missing-binary --output stdout

  gold-recovery-probe:
    name: gold recovery probe / ${{ matrix.os }}
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[gold-recovery-probe]') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24
          install: false

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Observe provider-free recovery CLI surfaces
        timeout-minutes: 10
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const {
            chmodSync,
            existsSync,
            mkdirSync,
            mkdtempSync,
            readdirSync,
            statSync,
            writeFileSync,
          } = require('node:fs');
          const { tmpdir } = require('node:os');
          const { basename, join, resolve } = require('node:path');
          const { spawnSync } = require('node:child_process');

          const workspace = resolve(process.env.GITHUB_WORKSPACE || process.cwd());
          const probeRoot = mkdtempSync(join(resolve(process.env.RUNNER_TEMP || tmpdir()), 'delethos-gold-recovery-'));
          const target = `${process.platform}:${process.arch}`;

          const targets = {
            'linux:x64': {
              platform: 'linux',
              arch: 'x64',
              copilot: {
                asset: 'copilot-linux-x64.tar.gz',
                sha256: '37fa67686a9e4ed8d46dcd6a9c80ab524dea840ecaa0a3f7edf8d09f961b97a9',
              },
              pi: {
                asset: 'pi-linux-x64.tar.gz',
                sha256: 'c2f3c3e6a1850bd87654cc3ca8811013272397c3d042a4e2a64c43ee1b423972',
              },
            },
            'darwin:arm64': {
              platform: 'macos',
              arch: 'arm64',
              copilot: {
                asset: 'copilot-darwin-arm64.tar.gz',
                sha256: 'c03bfc58c4402ec31d09ca11c379e1c17e95c3441f48009d721bf556fcc2c42e',
              },
              pi: {
                asset: 'pi-darwin-arm64.tar.gz',
                sha256: 'c68e3ac4d05b4e282aaab2e6c76f161d3e9e68f19a22e38913cbfaadb6c800f0',
              },
            },
            'win32:x64': {
              platform: 'windows',
              arch: 'x64',
              copilot: {
                asset: 'copilot-win32-x64.zip',
                sha256: 'dec18634ab7cc62a8c6829b1a25e6dd84a22e941a9b9f75ef88e3ec2a718b78f',
              },
              pi: {
                asset: 'pi-windows-x64.zip',
                sha256: '03b2318774f18721e959d9f8f3340a9f942e7aa516fb7030d3007a12a40a4a97',
              },
            },
          };

          const selected = targets[target];
          if (!selected) throw new Error(`unsupported hosted recovery platform ${target}`);

          function git(args) {
            const result = spawnSync('git', args, {
              cwd: workspace,
              encoding: 'utf8',
              shell: false,
              timeout: 10_000,
            });
            if (result.status !== 0) throw new Error(`git ${args[0]} failed`);
            return result.stdout.replace(/\r\n/g, '\n').trimEnd();
          }

          function snapshotRepository() {
            return {
              head: git(['rev-parse', 'HEAD']),
              refs: git(['for-each-ref', '--format=%(refname) %(objectname)']),
              status: git(['status', '--porcelain=v1', '--untracked-files=all']),
            };
          }

          function repositoryChanged(before, after) {
            return before.head !== after.head || before.refs !== after.refs || before.status !== after.status;
          }

          function findExactExecutable(root, filename) {
            const matches = [];
            const pending = [root];
            while (pending.length > 0) {
              const current = pending.pop();
              for (const entry of readdirSync(current, { withFileTypes: true })) {
                const path = join(current, entry.name);
                if (entry.isDirectory()) pending.push(path);
                else if (entry.isFile() && entry.name.toLowerCase() === filename.toLowerCase()) matches.push(path);
              }
            }
            if (matches.length !== 1) {
              throw Object.assign(new Error(`expected exactly one ${filename}; observed ${matches.length}`), { result: 'LAUNCH_FAILED' });
            }
            return matches[0];
          }

          async function downloadVerified(url, destination, expectedSha256) {
            let response;
            try {
              response = await fetch(url, { redirect: 'follow', signal: AbortSignal.timeout(90_000) });
            } catch {
              throw Object.assign(new Error('public release download failed or timed out'), { result: 'INTEGRITY_FAILED' });
            }
            if (!response.ok) {
              throw Object.assign(new Error(`public release download returned HTTP ${response.status}`), { result: 'INTEGRITY_FAILED' });
            }
            let bytes;
            try {
              bytes = Buffer.from(await response.arrayBuffer());
            } catch {
              throw Object.assign(new Error('public release body failed or timed out'), { result: 'INTEGRITY_FAILED' });
            }
            const observed = createHash('sha256').update(bytes).digest('hex');
            if (observed !== expectedSha256) {
              throw Object.assign(new Error('release asset SHA-256 mismatch'), { result: 'INTEGRITY_FAILED' });
            }
            writeFileSync(destination, bytes, { flag: 'wx' });
          }

          function exactWindowsExtractionEnvironment(assetPath, extractRoot) {
            const values = {
              PATH: process.env.PATH ?? process.env.Path ?? '',
              DELETHOS_ARCHIVE: assetPath,
              DELETHOS_EXTRACT: extractRoot,
            };
            for (const key of ['SystemRoot', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP']) {
              if (process.env[key] !== undefined) values[key] = process.env[key];
            }
            return values;
          }

          function extractVerifiedAsset(assetPath, extractRoot) {
            mkdirSync(extractRoot, { recursive: false });
            let extraction;
            if (process.platform === 'win32') {
              extraction = spawnSync(
                'pwsh.exe',
                [
                  '-NoLogo',
                  '-NoProfile',
                  '-NonInteractive',
                  '-Command',
                  "$ErrorActionPreference='Stop'; Expand-Archive -LiteralPath $env:DELETHOS_ARCHIVE -DestinationPath $env:DELETHOS_EXTRACT -Force",
                ],
                {
                  cwd: probeRoot,
                  encoding: 'utf8',
                  shell: false,
                  timeout: 120_000,
                  env: exactWindowsExtractionEnvironment(assetPath, extractRoot),
                },
              );
            } else {
              extraction = spawnSync('tar', ['-xf', assetPath, '-C', extractRoot], {
                cwd: probeRoot,
                encoding: 'utf8',
                shell: false,
                timeout: 120_000,
              });
            }
            if (extraction.error || extraction.status !== 0) {
              throw Object.assign(new Error('verified release extraction failed'), { result: 'LAUNCH_FAILED' });
            }
          }

          function safeEnvironment(candidateRoot, candidateId) {
            const configRoot = join(candidateRoot, 'config');
            const sessionRoot = join(candidateRoot, 'sessions');
            const tempRoot = join(candidateRoot, 'tmp');
            for (const directory of [configRoot, sessionRoot, tempRoot]) mkdirSync(directory, { recursive: true });

            const values = {
              PATH: process.env.PATH ?? process.env.Path ?? '',
              CI: 'true',
              NO_COLOR: '1',
              TERM: 'dumb',
              HOME: configRoot,
              TMP: tempRoot,
              TEMP: tempRoot,
              XDG_CONFIG_HOME: configRoot,
              XDG_CACHE_HOME: join(configRoot, 'cache'),
              XDG_DATA_HOME: join(configRoot, 'data'),
            };

            if (process.platform === 'win32') {
              for (const key of ['SystemRoot', 'WINDIR', 'COMSPEC', 'PATHEXT']) {
                if (process.env[key] !== undefined) values[key] = process.env[key];
              }
              values.USERPROFILE = configRoot;
              values.APPDATA = join(configRoot, 'AppData', 'Roaming');
              values.LOCALAPPDATA = join(configRoot, 'AppData', 'Local');
            }

            if (candidateId === 'github-copilot-cli') {
              values.COPILOT_HOME = configRoot;
              values.COPILOT_AUTO_UPDATE = 'false';
            } else {
              values.PI_CODING_AGENT_DIR = configRoot;
              values.PI_CODING_AGENT_SESSION_DIR = sessionRoot;
            }
            return values;
          }

          function boundedReason(error) {
            const text = error instanceof Error ? error.message : String(error);
            return text.replace(/[\r\n]+/g, ' ').slice(0, 240);
          }

          function baseRecord(definition) {
            return {
              source: 'HOSTED_CLI_FEASIBILITY',
              candidate_id: definition.id,
              candidate_version: definition.version,
              platform: selected.platform,
              arch: selected.arch,
              observation_status: 'UNVERIFIED',
              observation_result: 'OTHER_FAILURE',
              failure_reason: null,
              executable_present: false,
              version_exact: false,
              help_exit_code: null,
              programmatic_surface_observed: 'UNVERIFIED',
              machine_readable_surface_observed: 'UNVERIFIED',
              cwd_control_surface_observed: definition.id === 'pi-coding-agent' ? 'NOT_APPLICABLE' : 'UNVERIFIED',
              permission_control_surface_observed: 'UNVERIFIED',
              provider_model_identity_surface_observed: 'UNVERIFIED',
              configuration_isolation_surface_observed: 'UNVERIFIED',
              provider_request_made: false,
              authentication_attempted: false,
              secret_referenced: false,
              repository_mutated: 'UNKNOWN',
            };
          }

          function unsupportedSurfaceKeys(record) {
            const keys = [
              'programmatic_surface_observed',
              'machine_readable_surface_observed',
              'permission_control_surface_observed',
              'provider_model_identity_surface_observed',
              'configuration_isolation_surface_observed',
            ];
            if (record.cwd_control_surface_observed !== 'NOT_APPLICABLE') keys.push('cwd_control_surface_observed');
            return keys.filter((key) => record[key] !== true);
          }

          (async () => {
            const { superviseProcess } = await import('./packages/runtime/src/process.ts');
            const initialRepository = snapshotRepository();
            let failed = false;

            const definitions = [
              {
                id: 'github-copilot-cli',
                version: '1.0.82',
                releaseBase: 'https://github.com/github/copilot-cli/releases/download/v1.0.82',
                executable: process.platform === 'win32' ? 'copilot.exe' : 'copilot',
                asset: selected.copilot.asset,
                sha256: selected.copilot.sha256,
                versionArgs: ['--version'],
                helpArgs: ['--help'],
                detect(help) {
                  return {
                    programmatic_surface_observed: help.includes('--prompt') && /(^|\s)-p([,\s]|$)/m.test(help),
                    machine_readable_surface_observed: help.includes('--output-format') && /json/i.test(help),
                    cwd_control_surface_observed: /(^|\s)-C([,\s]|$)/m.test(help),
                    permission_control_surface_observed: help.includes('--deny-tool') && help.includes('--available-tools') && help.includes('--no-ask-user'),
                    provider_model_identity_surface_observed: help.includes('--model'),
                    configuration_isolation_surface_observed: help.includes('COPILOT_HOME') || help.includes('--config-dir'),
                  };
                },
              },
              {
                id: 'pi-coding-agent',
                version: '0.84.4',
                releaseBase: 'https://github.com/earendil-works/pi/releases/download/v0.84.4',
                executable: process.platform === 'win32' ? 'pi.exe' : 'pi',
                asset: selected.pi.asset,
                sha256: selected.pi.sha256,
                versionArgs: ['--offline', '--version'],
                helpArgs: ['--offline', '--help'],
                detect(help) {
                  return {
                    programmatic_surface_observed: help.includes('--print'),
                    machine_readable_surface_observed: help.includes('--mode') && /\bjson\b/i.test(help) && /\brpc\b/i.test(help),
                    cwd_control_surface_observed: 'NOT_APPLICABLE',
                    permission_control_surface_observed: help.includes('--no-tools') && help.includes('--tools') && help.includes('--exclude-tools'),
                    provider_model_identity_surface_observed: help.includes('--provider') && help.includes('--model'),
                    configuration_isolation_surface_observed: help.includes('PI_CODING_AGENT_DIR'),
                  };
                },
              },
            ];

            async function observe(definition) {
              const record = baseRecord(definition);
              const before = snapshotRepository();
              const candidateRoot = join(probeRoot, definition.id);
              if (existsSync(candidateRoot)) {
                throw Object.assign(new Error('candidate temporary root unexpectedly already exists'), { result: 'INTEGRITY_FAILED' });
              }
              mkdirSync(candidateRoot, { recursive: false });
              const assetPath = join(candidateRoot, basename(definition.asset));
              const extractRoot = join(candidateRoot, 'extract');
              const workRoot = join(candidateRoot, 'work');
              mkdirSync(workRoot, { recursive: false });

              try {
                await downloadVerified(`${definition.releaseBase}/${definition.asset}`, assetPath, definition.sha256);
                extractVerifiedAsset(assetPath, extractRoot);
                const executable = findExactExecutable(extractRoot, definition.executable);
                record.executable_present = true;
                if (process.platform !== 'win32') chmodSync(executable, 0o755);
                if (!statSync(executable).isFile()) {
                  throw Object.assign(new Error('resolved executable is not a regular file'), { result: 'LAUNCH_FAILED' });
                }

                const environment = safeEnvironment(candidateRoot, definition.id);
                const run = async (args) => {
                  const allowed = JSON.stringify(args) === JSON.stringify(definition.versionArgs) || JSON.stringify(args) === JSON.stringify(definition.helpArgs);
                  if (!allowed) throw Object.assign(new Error('unauthorized recovery-probe argv'), { result: 'LAUNCH_FAILED' });
                  const supervised = superviseProcess({
                    command: executable,
                    args,
                    cwd: workRoot,
                    environment: { mode: 'EXACT', values: environment },
                    timeoutMs: 15_000,
                    terminationGraceMs: 1_000,
                    outputLimitBytes: 65_536,
                  });
                  const result = await supervised.result;
                  if (result.cause === 'TIMED_OUT') {
                    const status = result.cleanupStatus === 'SUCCEEDED' ? 'FAIL' : 'UNVERIFIED';
                    throw Object.assign(new Error(`CLI observation timed out; cleanup=${result.cleanupStatus}`), { result: 'TIMEOUT', status });
                  }
                  if (result.cause !== 'EXITED') {
                    throw Object.assign(new Error(`CLI observation ended with ${result.cause}; cleanup=${result.cleanupStatus}`), { result: 'LAUNCH_FAILED' });
                  }
                  return result;
                };

                const versionResult = await run(definition.versionArgs);
                if (versionResult.exitCode !== 0) {
                  throw Object.assign(new Error(`version observation exited ${versionResult.exitCode}`), { result: 'VERSION_MISMATCH' });
                }
                const versionText = `${versionResult.stdout}\n${versionResult.stderr}`;
                const escapedVersion = definition.version.replace(/\./g, '\\.');
                if (!new RegExp(`(^|\\D)${escapedVersion}(\\D|$)`).test(versionText)) {
                  throw Object.assign(new Error('exact candidate version was not observed'), { result: 'VERSION_MISMATCH' });
                }
                record.version_exact = true;

                const helpResult = await run(definition.helpArgs);
                record.help_exit_code = helpResult.exitCode;
                if (helpResult.exitCode !== 0) {
                  throw Object.assign(new Error(`help observation exited ${helpResult.exitCode}`), { result: 'LAUNCH_FAILED' });
                }
                const help = `${helpResult.stdout}\n${helpResult.stderr}`;
                Object.assign(record, definition.detect(help));

                const unsupported = unsupportedSurfaceKeys(record);
                if (unsupported.length > 0) {
                  throw Object.assign(
                    new Error(`required automation surface not observed: ${unsupported.join(',')}`),
                    { result: 'UNSUPPORTED_SURFACE', status: 'FAIL' },
                  );
                }

                const after = snapshotRepository();
                record.repository_mutated = repositoryChanged(before, after);
                if (record.repository_mutated) {
                  throw Object.assign(new Error('candidate observation changed repository HEAD, refs, or worktree state'), { result: 'OTHER_FAILURE', status: 'FAIL' });
                }

                record.observation_status = 'PASS';
                record.observation_result = 'COMPLETED';
                record.failure_reason = null;
              } catch (error) {
                const after = snapshotRepository();
                record.repository_mutated = repositoryChanged(before, after);
                record.observation_status =
                  (error && error.status === 'FAIL') || record.repository_mutated === true
                    ? 'FAIL'
                    : 'UNVERIFIED';
                record.observation_result = error && typeof error.result === 'string' ? error.result : 'OTHER_FAILURE';
                record.failure_reason = boundedReason(error);
                failed = true;
              }

              console.log(JSON.stringify(record));
            }

            for (const definition of definitions) await observe(definition);

            const finalRepository = snapshotRepository();
            if (repositoryChanged(initialRepository, finalRepository)) {
              failed = true;
              console.log(JSON.stringify({
                source: 'HOSTED_CLI_FEASIBILITY',
                observation_status: 'FAIL',
                observation_result: 'OTHER_FAILURE',
                failure_reason: 'overall probe changed repository HEAD, refs, or worktree state',
              }));
            }

            if (failed) process.exitCode = 1;
          })().catch((error) => {
            console.error(`gold recovery probe harness failed: ${boundedReason(error)}`);
            process.exitCode = 1;
          });
          NODE

  opencode-recovery-probe:
    name: opencode recovery probe / ${{ matrix.os }}
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[opencode-recovery-probe]') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24
          install: false

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Observe provider-free OpenCode recovery surface
        timeout-minutes: 10
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const {
            chmodSync,
            existsSync,
            mkdirSync,
            mkdtempSync,
            readFileSync,
            readdirSync,
            statSync,
            writeFileSync,
          } = require('node:fs');
          const { tmpdir } = require('node:os');
          const { basename, join, resolve } = require('node:path');
          const { spawnSync } = require('node:child_process');

          const workspace = resolve(process.env.GITHUB_WORKSPACE || process.cwd());
          const probeRoot = mkdtempSync(join(resolve(process.env.RUNNER_TEMP || tmpdir()), 'delethos-opencode-recovery-'));
          const target = `${process.platform}:${process.arch}`;
          const releaseBase = 'https://github.com/anomalyco/opencode/releases/download/v1.18.26';
          const targets = {
            'linux:x64': {
              platform: 'linux',
              arch: 'x64',
              asset: 'opencode-linux-x64.tar.gz',
              sha256: '7c20c1ffa91bcca0ac903752260bcc36307dff656833baead2f5ef3b224b16c6',
              executable: 'opencode',
            },
            'darwin:arm64': {
              platform: 'macos',
              arch: 'arm64',
              asset: 'opencode-darwin-arm64.zip',
              sha256: 'b05d383149a5a417140e8edebd83064142fa36e74fdfcd5f791919dcb12fd33a',
              executable: 'opencode',
            },
            'win32:x64': {
              platform: 'windows',
              arch: 'x64',
              asset: 'opencode-windows-x64.zip',
              sha256: 'c7af81e288dff3cf4378c9f3509208ef8bf060d7109589fee2cd943845d87786',
              executable: 'opencode.exe',
            },
          };
          const selected = targets[target];
          if (!selected) throw new Error(`unsupported hosted OpenCode recovery platform ${target}`);

          function git(args) {
            const result = spawnSync('git', args, {
              cwd: workspace,
              encoding: 'utf8',
              shell: false,
              timeout: 10_000,
            });
            if (result.status !== 0) throw new Error(`git ${args[0]} failed`);
            return result.stdout.replace(/\r\n/g, '\n').trimEnd();
          }

          function snapshotRepository() {
            return {
              head: git(['rev-parse', 'HEAD']),
              refs: git(['for-each-ref', '--format=%(refname) %(objectname)']),
              status: git(['status', '--porcelain=v1', '--untracked-files=all']),
            };
          }

          function repositoryChanged(before, after) {
            return before.head !== after.head || before.refs !== after.refs || before.status !== after.status;
          }

          function findExactExecutable(root, filename) {
            const matches = [];
            const pending = [root];
            while (pending.length > 0) {
              const current = pending.pop();
              for (const entry of readdirSync(current, { withFileTypes: true })) {
                const path = join(current, entry.name);
                if (entry.isDirectory()) pending.push(path);
                else if (entry.isFile() && entry.name.toLowerCase() === filename.toLowerCase()) matches.push(path);
              }
            }
            if (matches.length !== 1) {
              throw Object.assign(new Error(`expected exactly one ${filename}; observed ${matches.length}`), { result: 'LAUNCH_FAILED' });
            }
            return matches[0];
          }

          async function downloadVerified(url, destination, expectedSha256) {
            let response;
            try {
              response = await fetch(url, { redirect: 'follow', signal: AbortSignal.timeout(90_000) });
            } catch {
              throw Object.assign(new Error('public OpenCode release download failed or timed out'), { result: 'INTEGRITY_FAILED' });
            }
            if (!response.ok) {
              throw Object.assign(new Error(`public OpenCode release download returned HTTP ${response.status}`), { result: 'INTEGRITY_FAILED' });
            }
            let bytes;
            try {
              bytes = Buffer.from(await response.arrayBuffer());
            } catch {
              throw Object.assign(new Error('public OpenCode release body failed or timed out'), { result: 'INTEGRITY_FAILED' });
            }
            const observed = createHash('sha256').update(bytes).digest('hex');
            if (observed !== expectedSha256) {
              throw Object.assign(new Error('OpenCode release asset SHA-256 mismatch'), { result: 'INTEGRITY_FAILED' });
            }
            writeFileSync(destination, bytes, { flag: 'wx' });
          }

          function exactWindowsExtractionEnvironment(assetPath, extractRoot) {
            const values = {
              PATH: process.env.PATH ?? process.env.Path ?? '',
              DELETHOS_ARCHIVE: assetPath,
              DELETHOS_EXTRACT: extractRoot,
            };
            for (const key of ['SystemRoot', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP']) {
              if (process.env[key] !== undefined) values[key] = process.env[key];
            }
            return values;
          }

          function extractVerifiedAsset(assetPath, extractRoot) {
            mkdirSync(extractRoot, { recursive: false });
            let extraction;
            if (process.platform === 'win32') {
              extraction = spawnSync(
                'pwsh.exe',
                [
                  '-NoLogo',
                  '-NoProfile',
                  '-NonInteractive',
                  '-Command',
                  "$ErrorActionPreference='Stop'; Expand-Archive -LiteralPath $env:DELETHOS_ARCHIVE -DestinationPath $env:DELETHOS_EXTRACT -Force",
                ],
                {
                  cwd: probeRoot,
                  encoding: 'utf8',
                  shell: false,
                  timeout: 120_000,
                  env: exactWindowsExtractionEnvironment(assetPath, extractRoot),
                },
              );
            } else {
              extraction = spawnSync('tar', ['-xf', assetPath, '-C', extractRoot], {
                cwd: probeRoot,
                encoding: 'utf8',
                shell: false,
                timeout: 120_000,
              });
            }
            if (extraction.error || extraction.status !== 0) {
              throw Object.assign(new Error('verified OpenCode release extraction failed'), { result: 'LAUNCH_FAILED' });
            }
          }

          function boundedReason(error) {
            const text = error instanceof Error ? error.message : String(error);
            return text.replace(/[\r\n]+/g, ' ').slice(0, 240);
          }

          function containsPathFragment(root, fragment) {
            if (!existsSync(root)) return false;
            const pending = [root];
            const needle = fragment.toLowerCase();
            while (pending.length > 0) {
              const current = pending.pop();
              for (const entry of readdirSync(current, { withFileTypes: true })) {
                const path = join(current, entry.name);
                if (path.toLowerCase().includes(needle)) return true;
                if (entry.isDirectory()) pending.push(path);
              }
            }
            return false;
          }

          (async () => {
            const { superviseProcess } = await import('./packages/runtime/src/process.ts');
            const initialRepository = snapshotRepository();
            const record = {
              source: 'HOSTED_CLI_FEASIBILITY',
              candidate_id: 'opencode',
              candidate_version: '1.18.26',
              platform: selected.platform,
              arch: selected.arch,
              observation_status: 'UNVERIFIED',
              observation_result: 'OTHER_FAILURE',
              failure_reason: null,
              executable_present: false,
              version_exact: false,
              help_exit_code: null,
              headless_run_surface_observed: 'UNVERIFIED',
              machine_readable_json_surface_observed: 'UNVERIFIED',
              cwd_control_surface_observed: 'UNVERIFIED',
              composite_provider_model_surface_observed: 'UNVERIFIED',
              permission_policy_surface_observed: 'UNVERIFIED',
              configuration_isolation_surface_observed: 'UNVERIFIED',
              project_config_disable_surface_observed: 'UNVERIFIED',
              plugin_install_suppression_surface_observed: 'UNVERIFIED',
              auto_update_disable_surface_observed: 'UNVERIFIED',
              provider_request_made: false,
              authentication_attempted: false,
              secret_referenced: false,
              repository_mutated: 'UNKNOWN',
            };

            const before = snapshotRepository();
            try {
              const candidateRoot = join(probeRoot, 'opencode');
              const extractRoot = join(candidateRoot, 'extract');
              const workRoot = join(candidateRoot, 'work');
              const homeRoot = join(candidateRoot, 'home');
              const configRoot = join(candidateRoot, 'config');
              const dataRoot = join(candidateRoot, 'data');
              const cacheRoot = join(candidateRoot, 'cache');
              const stateRoot = join(candidateRoot, 'state');
              const tempRoot = join(candidateRoot, 'tmp');
              for (const directory of [candidateRoot, workRoot, homeRoot, configRoot, dataRoot, cacheRoot, stateRoot, tempRoot]) {
                if (!existsSync(directory)) mkdirSync(directory, { recursive: false });
              }

              const assetPath = join(candidateRoot, basename(selected.asset));
              await downloadVerified(`${releaseBase}/${selected.asset}`, assetPath, selected.sha256);
              extractVerifiedAsset(assetPath, extractRoot);
              const executable = findExactExecutable(extractRoot, selected.executable);
              record.executable_present = true;
              if (process.platform !== 'win32') chmodSync(executable, 0o755);
              if (!statSync(executable).isFile()) {
                throw Object.assign(new Error('resolved OpenCode executable is not a regular file'), { result: 'LAUNCH_FAILED' });
              }

              const configPath = join(configRoot, 'opencode.json');
              writeFileSync(
                configPath,
                JSON.stringify({ autoupdate: false, permission: { '*': 'deny' } }, null, 2),
                { flag: 'wx' },
              );
              writeFileSync(
                join(workRoot, 'opencode.json'),
                JSON.stringify({ autoupdate: true, permission: { '*': 'allow' } }, null, 2),
                { flag: 'wx' },
              );

              const environment = {
                PATH: process.env.PATH ?? process.env.Path ?? '',
                CI: 'true',
                NO_COLOR: '1',
                TERM: 'dumb',
                HOME: homeRoot,
                TMP: tempRoot,
                TEMP: tempRoot,
                XDG_CONFIG_HOME: configRoot,
                XDG_DATA_HOME: dataRoot,
                XDG_CACHE_HOME: cacheRoot,
                XDG_STATE_HOME: stateRoot,
                OPENCODE_CONFIG_DIR: configRoot,
                OPENCODE_DISABLE_PROJECT_CONFIG: '1',
                OPENCODE_PURE: '1',
                OPENCODE_DISABLE_AUTOUPDATE: '1',
                OPENCODE_DISABLE_MODELS_FETCH: '1',
                OPENCODE_DISABLE_PRUNE: '1',
                OPENCODE_DISABLE_CLAUDE_CODE: '1',
                OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: '1',
                OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: '1',
              };
              if (process.platform === 'win32') {
                for (const key of ['SystemRoot', 'WINDIR', 'COMSPEC', 'PATHEXT']) {
                  if (process.env[key] !== undefined) environment[key] = process.env[key];
                }
                environment.USERPROFILE = homeRoot;
                environment.APPDATA = join(homeRoot, 'AppData', 'Roaming');
                environment.LOCALAPPDATA = join(homeRoot, 'AppData', 'Local');
              }

              const allowedArgv = new Set([
                JSON.stringify(['--version']),
                JSON.stringify(['--help']),
                JSON.stringify(['run', '--help']),
                JSON.stringify(['debug', 'config']),
              ]);
              const run = async (args) => {
                if (!allowedArgv.has(JSON.stringify(args))) {
                  throw Object.assign(new Error('unauthorized OpenCode recovery-probe argv'), { result: 'LAUNCH_FAILED' });
                }
                const supervised = superviseProcess({
                  command: executable,
                  args,
                  cwd: workRoot,
                  environment: { mode: 'EXACT', values: environment },
                  timeoutMs: 15_000,
                  terminationGraceMs: 1_000,
                  outputLimitBytes: 65_536,
                });
                const result = await supervised.result;
                if (result.cause === 'TIMED_OUT') {
                  const status = result.cleanupStatus === 'SUCCEEDED' ? 'FAIL' : 'UNVERIFIED';
                  throw Object.assign(new Error(`OpenCode observation timed out; cleanup=${result.cleanupStatus}`), { result: 'TIMEOUT', status });
                }
                if (result.cause !== 'EXITED') {
                  throw Object.assign(new Error(`OpenCode observation ended with ${result.cause}; cleanup=${result.cleanupStatus}`), { result: 'LAUNCH_FAILED' });
                }
                return result;
              };

              const versionResult = await run(['--version']);
              if (versionResult.exitCode !== 0) {
                throw Object.assign(new Error(`OpenCode version observation exited ${versionResult.exitCode}`), { result: 'VERSION_MISMATCH' });
              }
              const versionText = `${versionResult.stdout}\n${versionResult.stderr}`;
              if (!/(^|\D)1\.18\.26(\D|$)/.test(versionText)) {
                throw Object.assign(new Error('exact OpenCode 1.18.26 version was not observed'), { result: 'VERSION_MISMATCH' });
              }
              record.version_exact = true;

              const rootHelp = await run(['--help']);
              record.help_exit_code = rootHelp.exitCode;
              if (rootHelp.exitCode !== 0) {
                throw Object.assign(new Error(`OpenCode root help exited ${rootHelp.exitCode}`), { result: 'LAUNCH_FAILED' });
              }
              const rootHelpText = `${rootHelp.stdout}\n${rootHelp.stderr}`;

              const runHelp = await run(['run', '--help']);
              if (runHelp.exitCode !== 0) {
                throw Object.assign(new Error(`OpenCode run help exited ${runHelp.exitCode}`), { result: 'LAUNCH_FAILED' });
              }
              const runHelpText = `${runHelp.stdout}\n${runHelp.stderr}`;

              const debugConfig = await run(['debug', 'config']);
              if (debugConfig.exitCode !== 0) {
                throw Object.assign(new Error(`OpenCode debug config exited ${debugConfig.exitCode}`), { result: 'LAUNCH_FAILED' });
              }
              let resolvedConfig;
              try {
                resolvedConfig = JSON.parse(debugConfig.stdout);
              } catch {
                throw Object.assign(new Error('OpenCode debug config did not emit valid JSON'), { result: 'UNSUPPORTED_SURFACE', status: 'FAIL' });
              }

              const binary = readFileSync(executable);
              const hasLiteral = (value) => binary.includes(Buffer.from(value, 'utf8'));
              const resolvedDeny = resolvedConfig?.permission?.['*'] === 'deny';
              const resolvedNoUpdate = resolvedConfig?.autoupdate === false;

              record.headless_run_surface_observed = /\brun\b/i.test(rootHelpText) && /run opencode with a message/i.test(runHelpText);
              record.machine_readable_json_surface_observed = runHelpText.includes('--format') && /\bjson\b/i.test(runHelpText);
              record.cwd_control_surface_observed = runHelpText.includes('--dir');
              record.composite_provider_model_surface_observed = runHelpText.includes('--model') && /provider\/model/i.test(runHelpText);
              record.permission_policy_surface_observed = resolvedDeny;
              record.configuration_isolation_surface_observed = resolvedDeny && resolvedNoUpdate;
              record.project_config_disable_surface_observed = resolvedDeny && resolvedNoUpdate && hasLiteral('OPENCODE_DISABLE_PROJECT_CONFIG');
              record.plugin_install_suppression_surface_observed = hasLiteral('OPENCODE_PURE') && !containsPathFragment(configRoot, 'node_modules');
              record.auto_update_disable_surface_observed = resolvedNoUpdate && hasLiteral('OPENCODE_DISABLE_AUTOUPDATE');

              const required = [
                'headless_run_surface_observed',
                'machine_readable_json_surface_observed',
                'cwd_control_surface_observed',
                'composite_provider_model_surface_observed',
                'permission_policy_surface_observed',
                'configuration_isolation_surface_observed',
                'project_config_disable_surface_observed',
                'plugin_install_suppression_surface_observed',
                'auto_update_disable_surface_observed',
              ];
              const unsupported = required.filter((key) => record[key] !== true);
              if (unsupported.length > 0) {
                throw Object.assign(
                  new Error(`required OpenCode recovery surface not observed: ${unsupported.join(',')}`),
                  { result: 'UNSUPPORTED_SURFACE', status: 'FAIL' },
                );
              }

              const after = snapshotRepository();
              record.repository_mutated = repositoryChanged(before, after);
              if (record.repository_mutated) {
                throw Object.assign(new Error('OpenCode observation changed repository HEAD, refs, or worktree state'), { result: 'OTHER_FAILURE', status: 'FAIL' });
              }

              record.observation_status = 'PASS';
              record.observation_result = 'COMPLETED';
              record.failure_reason = null;
            } catch (error) {
              const after = snapshotRepository();
              record.repository_mutated = repositoryChanged(before, after);
              record.observation_status =
                (error && error.status === 'FAIL') || record.repository_mutated === true
                  ? 'FAIL'
                  : 'UNVERIFIED';
              record.observation_result = error && typeof error.result === 'string' ? error.result : 'OTHER_FAILURE';
              record.failure_reason = boundedReason(error);
            }

            console.log(JSON.stringify(record));

            const finalRepository = snapshotRepository();
            if (repositoryChanged(initialRepository, finalRepository)) {
              console.log(JSON.stringify({
                source: 'HOSTED_CLI_FEASIBILITY',
                candidate_id: 'opencode',
                candidate_version: '1.18.26',
                platform: selected.platform,
                arch: selected.arch,
                observation_status: 'FAIL',
                observation_result: 'OTHER_FAILURE',
                failure_reason: 'overall OpenCode probe changed repository HEAD, refs, or worktree state',
              }));
              process.exitCode = 1;
            } else if (record.observation_status !== 'PASS') {
              process.exitCode = 1;
            }
          })().catch((error) => {
            console.error(`OpenCode recovery probe harness failed: ${boundedReason(error)}`);
            process.exitCode = 1;
          });
          NODE