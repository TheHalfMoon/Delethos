name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node 24
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24
          install: false

      - name: Record toolchain
        shell: bash
        run: |
          node --version
          pnpm --version
          git --version

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify zero production dependencies
        run: pnpm check:runtime-deps
